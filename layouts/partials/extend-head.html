{{ $author := site.Language.Params.author }}
{{ $siteDescription := site.Language.Params.description }}
{{ $siteTitle := site.Title }}
{{ $personID := printf "%s#person" site.BaseURL }}

<meta name="author" content="{{ $author.name }}">
<meta name="keywords" content="efficient deep learning, GPU optimization, CUDA, multimodal transformers, brain state decoding, neuroimaging, Danial Jafarzadeh">
<meta property="og:site_name" content="{{ $siteTitle }}">
<meta property="og:locale" content="en_US">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ $personID }}",
  "name": "{{ $author.name }}",
  "url": "{{ site.BaseURL }}",
  "email": "{{ $author.email }}",
  "image": "{{ "img/candle.png" | absURL }}",
  "jobTitle": "AI Systems Researcher",
  "description": "{{ $author.bio }}",
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Islamic Azad University, Central Tehran Branch"
  },
  "sameAs": [
    "https://github.com/Danialjfz",
    "https://www.linkedin.com/in/danial-jafarzadeh/",
    "https://arxiv.org/abs/2512.08462"
  ],
  "knowsAbout": [
    "Efficient Deep Learning",
    "GPU Programming",
    "CUDA",
    "Multimodal Transformers",
    "Brain State Decoding",
    "Neuroimaging",
    "Performance Optimization"
  ],
  "knowsLanguage": [
    {
      "@type": "Language",
      "name": "English"
    }
  ]
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ $siteTitle }}",
  "url": "{{ site.BaseURL }}",
  "description": "{{ $siteDescription }}",
  "inLanguage": "en-US",
  "author": {
    "@type": "Person",
    "@id": "{{ $personID }}"
  },
  "publisher": {
    "@type": "Person",
    "@id": "{{ $personID }}"
  }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "name": "{{ $siteTitle }}",
  "url": "{{ site.BaseURL }}",
  "description": "{{ $siteDescription }}",
  "inLanguage": "en-US",
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ $personID }}"
  }
}
</script>
